<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      スマートフォン最優先。
      viewport-fit=cover で、Android のジェスチャーバー / iOS のノッチ領域まで背景を伸ばす。
      user-scalable=no は付けない（拡大できないと読めない人が出るため）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Android のステータスバーの色 -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="今月あといくら使えるかが一目で分かる、自分専用の家計簿" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Kakeibo" />

    <!-- iOS でホーム画面から開いたときの表示 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kakeibo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>Kakeibo — あといくら使える？</title>

    <!--
      インストール可能になった合図（beforeinstallprompt）は
      React が動き出す前に飛んでくることがあるので、ここで先に捕まえておく。
      Chrome 既定のバナーは出さず、アプリ内のボタンから出す。
    -->
    <script>
      window.__installPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
        window.dispatchEvent(new Event('kakeibo:installable'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
